<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base Canvas Gradients -->
    <radialGradient id="sky-blue-glow" cx="82%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="top-left-amber" cx="5%" cy="8%" r="40%">
      <stop offset="0%" stop-color="#ffaa40" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ff6b00" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#d946ef" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bottom-coral-aurora" cx="88%" cy="92%" r="55%">
      <stop offset="0%" stop-color="#ff5722" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#ff7a00" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#e11d48" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bottom-left-aurora" cx="12%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#ff3e00" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f43f5e" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="magenta-ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#c026d3" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#8b5cf6" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="center-flow-grad" x1="15%" y1="75%" x2="85%" y2="25%">
      <stop offset="0%" stop-color="#ff4500" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#ec4899" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#7c3aed" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.5" />
    </linearGradient>

    <!-- Gaussian Blurs for soft cinematic atmosphere -->
    <filter id="ultra-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="85" result="blur" />
    </filter>

    <filter id="medium-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="55" result="blur" />
    </filter>

    <!-- Vertical Fluted Pleated Columns Pattern -->
    <pattern id="vertical-fluted-ribs" width="32" height="1080" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="16" height="1080" fill="rgba(255, 255, 255, 0.04)" />
      <line x1="0" y1="0" x2="0" y2="1080" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <line x1="16" y1="0" x2="16" y2="1080" stroke="rgba(0, 0, 0, 0.15)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Deep Midnight Navy Base Canvas -->
  <rect width="1920" height="1080" fill="#0c102b" />

  <!-- Base Atmospheric Glow Meshes with Heavy Blur -->
  <g filter="url(#ultra-blur)">
    <!-- Top Right Blue Sky -->
    <rect x="700" y="-100" width="1300" height="800" fill="url(#sky-blue-glow)" />

    <!-- Top Left Amber Sunrise -->
    <circle cx="150" cy="120" r="450" fill="url(#top-left-amber)" />

    <!-- Deep Center/Lower Indigo Field -->
    <ellipse cx="960" cy="540" rx="900" ry="500" fill="#1e1b4b" opacity="0.8" />

    <!-- Flowing S-Curve Magenta/Pink Ribbon -->
    <path d="M-100,200 C300,100 400,650 900,650 C1400,650 1600,350 2000,450 L2000,900 C1500,900 1300,800 900,850 C500,900 200,800 -100,700 Z" fill="url(#magenta-ribbon-grad)" opacity="0.85" />

    <!-- Center Swirl Wave -->
    <path d="M100,750 Q600,350 1100,550 T1900,400" fill="none" stroke="url(#center-flow-grad)" stroke-width="220" stroke-linecap="round" opacity="0.75" />

    <!-- Bottom Left Vibrant Fire Glow -->
    <circle cx="150" cy="850" r="480" fill="url(#bottom-left-aurora)" />

    <!-- Bottom Right Fiery Coral Neon Wave -->
    <circle cx="1700" cy="900" r="600" fill="url(#bottom-coral-aurora)" />
  </g>

  <!-- Mid-Layer Ribbons with Medium Blur for Depth -->
  <g filter="url(#medium-blur)" opacity="0.6">
    <path d="M-50,300 Q400,750 950,600 T1950,500" fill="none" stroke="#f43f5e" stroke-width="120" stroke-linecap="round" />
    <path d="M200,850 Q800,800 1300,950 T1950,850" fill="none" stroke="#ff5722" stroke-width="150" stroke-linecap="round" />
    <ellipse cx="1650" cy="350" rx="350" ry="250" fill="#38bdf8" opacity="0.4" />
  </g>

  <!-- Vertical Fluted Pleated Texture (Exact match to reference image) -->
  <rect width="1920" height="1080" fill="url(#vertical-fluted-ribs)" mix-blend-mode="overlay" opacity="0.7" />

  <!-- Soft Vignette & Atmosphere Unification -->
  <radialGradient id="canvas-vignette" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0" />
    <stop offset="80%" stop-color="#000000" stop-opacity="0.12" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#canvas-vignette)" />
</svg>
